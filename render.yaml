databases:
  - name: izumo-cafe-db
    plan: free
    databaseName: izumo_cafe
    user: izumo

services:
  - type: web
    name: my-rails-api
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails db:prepare && bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: izumo-cafe-db
          property: connectionString